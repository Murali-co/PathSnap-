[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "Directed road map matching with grouped model evaluation and Viterbi decoding"
requires-python = ">=3.12,<3.14"

[project.scripts]
pathsnap = "pathsnap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
